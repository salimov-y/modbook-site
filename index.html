<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modbook — Car Build Tracker</title>
<style>
  :root{ --bg:#0d0d0f; --card:#151518; --text:#ececf0; --muted:#9a9aa5; --line:#26262b; --accent:#f25c1a; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f6f7; --card:#ffffff; --text:#16161a; --muted:#5f5f6a; --line:#e4e4e8; --accent:#f25c1a; }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
  main{max-width:520px; text-align:center}
  .dot{width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,#2a2a2f,#111);
    border:1px solid var(--line); position:relative; margin:0 auto 20px}
  .dot::after{content:""; position:absolute; left:12px; top:14px; width:22px; height:6px; border-radius:3px; background:var(--accent)}
  h1{font-size:2rem; letter-spacing:-.02em; margin:.2em 0}
  p{color:var(--muted); margin:.4em 0 1.6em}
  .links{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  a{color:var(--text); text-decoration:none; border:1px solid var(--line); background:var(--card);
    padding:12px 22px; border-radius:12px; font-weight:600; transition:border-color .15s}
  a:hover{border-color:var(--accent)}
  .store{display:inline-flex; align-items:center; gap:10px; background:#000; color:#fff; border-color:#000;
    padding:10px 20px 10px 16px; margin-bottom:18px; text-align:left; line-height:1.15}
  .store:hover{border-color:var(--accent)}
  .store svg{width:26px; height:26px; fill:#fff; flex:none}
  .store small{display:block; font-size:.7rem; font-weight:500; opacity:.85}
  .store b{font-size:1.15rem; font-weight:600; letter-spacing:-.01em}
  @media (prefers-color-scheme: light){ .store{border-color:#000} }
  footer{margin-top:2.5rem; color:var(--muted); font-size:.85rem}
</style>
</head>
<body>
<main>
  <div class="dot"></div>
  <h1>Modbook</h1>
  <p>A digital garage for car enthusiasts — every mod, every service, every dollar. One timeline per car.</p>
  <a class="store" href="https://apps.apple.com/us/app/modbook-car-build-tracker/id6792492477" aria-label="Download Modbook on the App Store">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.7c-.03-2.6 2.13-3.86 2.23-3.92-1.22-1.78-3.11-2.02-3.78-2.05-1.6-.16-3.13.95-3.95.95-.82 0-2.07-.93-3.41-.9-1.75.03-3.37 1.02-4.27 2.59-1.83 3.17-.47 7.85 1.31 10.42.87 1.26 1.9 2.67 3.26 2.62 1.31-.05 1.8-.85 3.38-.85s2.03.85 3.41.82c1.41-.02 2.3-1.28 3.16-2.54.99-1.46 1.4-2.87 1.42-2.95-.03-.01-2.73-1.05-2.76-4.19zM13.78 5.03c.72-.87 1.2-2.08 1.07-3.29-1.04.04-2.29.69-3.04 1.56-.67.77-1.25 2-1.1 3.18 1.16.09 2.35-.59 3.07-1.45z"/></svg>
    <span><small>Download on the</small><b>App Store</b></span>
  </a>
  <div class="links">
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
  <footer>© 2026 Yaroslav Salimov</footer>
</main>
</body>
</html>
